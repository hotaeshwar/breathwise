name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean npm cache
        run: npm cache clean --force

      - name: Remove node_modules and lock file
        run: rm -rf node_modules package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
          RAZORPAY_KEY_ID: rzp_live_Tb4Km1evAI6DKr
          RAZORPAY_KEY_SECRET: siEna8s1RRfTcpIzC0PfEEQW
          NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_live_Tb4Km1evAI6DKr
          NEXT_PUBLIC_WHATSAPP_NUMBER: 919876963204
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCYKXJiBghOeVY1VV7FpG1dlES5kxsw9r4
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: breathwise-ecb47.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: breathwise-ecb47
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: breathwise-ecb47.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 311562925812
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:311562925812:web:e54e71823215546f0e90a1
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: nBHOuUM3urTjJRdFd
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: service_q9gimgs
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: template_evuuv7i

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
